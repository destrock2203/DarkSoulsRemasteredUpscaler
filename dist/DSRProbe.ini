; DSRProbe - diagnostic dxgi.dll for Dark Souls Remastered. It does not change the game: it writes
; what it learns to DSRProbe.log (and trace files / PNG dumps next to it).
; Put dxgi.dll and this file in the DARK SOULS REMASTERED folder (next to DarkSoulsRemastered.exe).

[Probe]
; Keys (F1-F24 or a virtual-key code), only while the game window has focus:
;   TraceKey    - record a full trace of the next frames (DSRProbe_trace_<frame>.txt) + PNG dumps
;   FlipperKey  - switch the engine's frame pacing object between 60 FPS and 140 FPS (test)
;   SnapshotKey - data snapshots: press, change ONE game setting, press, change it back, press
TraceKey=F10
FlipperKey=F11
SnapshotKey=F9
; Frames recorded per trace (1-4).
TraceFrames=2
; Also start a trace automatically at this frame number (0 = key only).
TraceAtFrame=0
; PNG dumps of the post-processing render targets, the TAA inputs, the image before the HUD and the
; back buffer (in DSRProbe_dumps\), during the last traced frame. MaxDumps limits their number.
DumpTextures=1
MaxDumps=48
; Shaders that are not in the game's shader archives (other overlays, ReShade) go to DSRProbe_shaders\.
DumpUnknownShaders=1
; Log every render target / depth / UAV texture the game creates.
LogResources=1
; Optional: another dxgi.dll to load instead of the system one (e.g. ReShade renamed ReShade64.dll).
ChainLoadDXGI=
