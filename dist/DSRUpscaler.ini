; DSRUpscaler configuration. Place next to dxgi.dll in the DARK SOULS REMASTERED folder.
; The in-game menu (Home) changes and saves most of these.

[General]
; 0 = pass-through only (proxy still loads, nothing is hooked).
Enabled=1
; trace | debug | info | warn | error
LogLevel=info

[Loader]
; Optional: another dxgi.dll to load instead of the system one (e.g. ReShade renamed to ReShade64.dll).
; Relative paths are resolved from this folder.
ChainLoadDXGI=
; 1 = also load upscaler / frame generation DLLs whose signature is missing or broken (modified
; community builds). 0 = only DLLs validly signed by their vendor.
AllowUnsignedDlls=1

[Upscaler]
; 1 = the upscaler replaces the game's TAA resolve (F7 toggles in game). Needs the game's
; Anti-aliasing option ON (the game's TAA provides the jitter and the velocity pass).
Enabled=1
; DLSS (NVIDIA RTX) | FSR (any GPU; FSR 4 where the AMD driver offers it) | XeSS (any GPU with SM 6.4)
Backend=DLSS
; Native = DLAA / FSR Native AA / XeSS AA at the game's resolution.
Quality=Native
; DLSS model preset: Default | K | M | L | J | F | E
DlssPreset=Default
; FSR upscaler version as listed in the menu (e.g. 3.1.5, 4.0.2). Empty = the newest this GPU runs.
FsrVersion=
; The game's resolution below the screen's in windowed mode: the window covers the screen so the upscaler
; fills it (the mode follows the game's resolution, see the menu). 0 = the window keeps the game's size.
FillScreen=1
; Diagnostics: flip the jitter the upscaler is told (if the image looks soft or shimmers).
JitterFlipX=0
JitterFlipY=0
; Sharpening of the scene before the HUD, any upscaler and with it off (also in the menu):
; Off | AMD (FidelityFX RCAS) | NVIDIA (Image Scaling, any GPU; AMD RCAS if unavailable) | Laplacian (crisper)
Sharpen=Off
; Strength, 0 - 1.
Sharpness=0.50

[DLSS5]
; DLSS 5 neural rendering (relighting) of the HUD-less scene. Needs the DLSS 5 runtime, nvngx_dlssnr.dll,
; in the DSRUpscaler folder (not included with the mod). RTX 50. Costs GPU time.
Enabled=0
; F1-F24 or a virtual-key code (0x77 = F8): on/off in game.
Key=F8
; Effect strength, 0 - 2.
Intensity=1.0
; Look / model variant, 0 - 7.
Style=1
LocalTone=0.5
LocalStructure=1.0
SkinStructure=-1.0

[FrameGeneration]
; DLSS (DLSS-G, RTX 40 series and newer) | FSR (any GPU) | XeSS (XeSS-FG, any GPU with SM 6.4).
; Applies at the next launch.
Backend=DLSS
; 1 = on (also toggled in game from the menu).
Enabled=0
; Generated frames per rendered frame: 1 = 2x, 2 = 3x, 3 = 4x. DLSS: 3x/4x need RTX 50 series. FSR: 2x.
GeneratedFrames=1
; 1 = the game presents through the mod's D3D12 swapchain, which frame generation needs (the game's
; exclusive fullscreen becomes a borderless window). 0 = the game keeps its own swapchain.
Presenter=1

[Game]
; Frame rate: the game's own 60 FPS, unless DS1 FPS Unlock (https://github.com/zofrea1/DS1-FPS-Unlock-PTDE-Remastered,
; installed separately: dinput8.dll + DSR-FPS-Unlock.ini next to the game) is there. It keeps the game's speed at
; any frame rate, and the limit is then set here and in the menu (Frame rate), live:
; 1 = the limit follows the monitor's refresh rate and the frame generation multiplier (game FPS x multiplier just
; below the refresh rate, for G-Sync / FreeSync); 0 = TargetFPS.
AutoFPS=1
; 30 - 500, 0 = DS1 FPS Unlock's MaxFPS. Frame generation multiplies it on screen.
TargetFPS=0
; V-Sync through the mod's swapchain: 0 = off (tearing allowed: G-Sync / FreeSync, the engine paces
; the frames), 1 = on, -1 = the game's (on). The game's fullscreen would switch the display to 60 Hz; the
; mod's borderless window keeps the desktop rate, where 60 FPS with V-Sync on judders.
VSync=0

[Overlay]
; F1-F24 or a virtual-key code (0x24 = Home).
MenuKey=0x24
; F1-F24 or a virtual-key code (0x76 = F7): upscaler on/off.
UpscalerKey=0x76
; Always-visible status line in the top-left corner.
StatusLine=1

[Debug]
; Logs every render target / depth texture the game creates.
LogResources=0
